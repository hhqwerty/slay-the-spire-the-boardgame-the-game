name: Deploy GitHub Pages (solo)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: VITE_ASSET_CDN_ORIGIN="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEPLOY_SHA/public/assets" VITE_ASSET_BACKUP_ORIGIN="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEPLOY_SHA/public/assets" VITE_SINGLE_PLAYER=true pnpm build
      - name: Keep large media outside the Pages size limit
        run: |
          find dist/assets/combat/rigged -type f -name '*.mov' -delete
          find dist/assets/combat -type f -name '*-attack.png' -delete
          find dist/assets/combat/rigged -type f -name 'hero-*-idle.webp' -delete
          find dist/assets/bgm -type f -delete
          du -sh dist
          test "$(du -sb dist | cut -f1)" -le 900000000
      - run: node scripts/check-single-player-build.mjs dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
